
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatSpot - AI Assistant</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
</head>
<body>
  
  <div id="auth-container" class="container">
    <div class="auth-box">
      <h1>ChatSpot</h1>
      <p class="subtitle">Your AI assistant powered by advanced language models</p>
      
    
      <div id="login-form" class="auth-form">
        <h2>Sign In</h2>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password">
        </div>
        <button id="login-button" class="btn-primary">Sign In</button>
        <p class="toggle-form">Don't have an account? <a id="show-signup">Sign Up</a></p>
      </div>
      
      
      <div id="signup-form" class="auth-form hidden">
        <h2>Create Account</h2>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="Choose a password (min 6 characters)">
        </div>
        <button id="signup-button" class="btn-primary">Sign Up</button>
        <p class="toggle-form">Already have an account? <a id="show-login">Sign In</a></p>
      </div>
    </div>
  </div>
  
  
  <div id="chat-container" class="container hidden">
    <header class="chat-header">
      <div class="logo">
        <h1>ChatSpot</h1>
      </div>
      <div class="user-info">
        <span id="user-email"></span>
        <div class="credits-display">
          <span>Credits: </span><span id="credits-count">0</span>
        </div>
        <button id="logout-button" class="btn-secondary">Log Out</button>
      </div>
    </header>
    
    <div class="chat-area">
      <div id="messages" class="messages">
        <div class="message system">
          <div class="message-content">
            <p>Welcome to ChatSpot! You have 20 credits per day. Each question costs 1 credit.</p>
          </div>
        </div>
      </div>
      
      <div class="input-area">
        <textarea id="message-input" placeholder="Ask me anything..." rows="1"></textarea>
        <button id="send-button" class="btn-primary">Send</button>
      </div>
    </div>
  </div>
  
 
  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
  </div>
  
  
  <div id="toast" class="toast hidden"></div>
  
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  
  <script src="auth.js"></script>
  <script src="credits.js"></script>
  <script src="chat.js"></script>
</body>
</html>
